<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Frame Renderer</title>
    <script src="https://media.youyan.xyz/youling-lite-sdk/mp4box.all.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        #videoCanvas {
            display: block;
            margin: 20px auto;
            background-color: #000;
            max-width: 100%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .status {
            text-align: center;
            color: #666;
            margin: 10px 0;
        }
        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #ddd;
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background-color: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Video Frame Renderer</h1>
        <div class="status" id="status">Loading videos...</div>
        <div class="stats">
            <div>Decoded: <span id="decodedFrames">0</span></div>
            <div>Rendered: <span id="renderedFrames">0</span></div>
            <div>Queue: <span id="queueSize">0</span></div>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <canvas id="videoCanvas"></canvas>
    </div>

    <script>
        // 视频列表
        const videoList = [
            // "https://public-xmov.oss-cn-hangzhou.aliyuncs.com/avatar_sdk_prod/body_ani/M_CN03_show02/look/zhiming02_12367_new/stand_by_unface04.mp4",
            // "https://public-xmov.oss-cn-hangzhou.aliyuncs.com/avatar_sdk_prod/body_ani/M_CN03_show02/look/zhiming02_12367_new/stand_by_unface03.mp4"
            "https://xmov-youyan.oss-cn-hangzhou.aliyuncs.com/video_encode_test/daoyou_ka21/daoyou_ka21_h264_libx264.mp4",
            "https://xmov-youyan.oss-cn-hangzhou.aliyuncs.com/video_encode_test/daoyou_ka21/daoyou_ka21_h264_nvenc.mp4",
            "https://xmov-youyan.oss-cn-hangzhou.aliyuncs.com/video_encode_test/daoyou_ka21/daoyou_ka21_h264_nvenc_540x960.mp4",
            "https://xmov-youyan.oss-cn-hangzhou.aliyuncs.com/video_encode_test/daoyou_ka21/daoyou_ka21_libx264_540x960.mp4"
        ];

        // 全局变量
        let canvas, ctx;
        let currentVideoIndex = 0;
        let frames = [];                // 帧队列
        let totalDecodedFrames = 0;     // 总解码帧数（累计）
        let totalRenderedFrames = 0;    // 总渲染帧数（累计）
        let currentVideoTotalFrames = 0;// 当前视频总帧数
        let isRendering = false;        // 渲染状态标记（避免重复启动）
        let isVideoComplete = false;    // 当前视频是否渲染完毕
        let worker = null;
        let animationFrameId = null;
        let lastRenderTime = 0;
        const FRAME_INTERVAL = 1000 / 24; // 24fps帧间隔
        const MIN_BUFFER_FRAMES = 5;    // 最小缓冲帧数（避免边解边渲染导致闪烁）

        // 初始化
        function init() {
            canvas = document.getElementById('videoCanvas');
            ctx = canvas.getContext('2d');
            processVideoList();
        }

        // 处理视频列表
        async function processVideoList() {
            // 重置当前视频状态
            isVideoComplete = false;
            frames = []; // 清空上一视频残留帧（关键：避免帧混合导致闪烁）
            
            if (currentVideoIndex >= videoList.length) {
                currentVideoIndex = 0; // 循环
                updateStatus(`Loop started. Total rendered: ${totalRenderedFrames}`);
            }

            const videoUrl = videoList[currentVideoIndex];
            updateStatus(`Processing video ${currentVideoIndex + 1}/${videoList.length}: ${videoUrl.split('/').pop()}`);
            updateProgress(0);
            currentVideoTotalFrames = 0;

            try {
                // 加载视频文件
                const response = await fetch(videoUrl);
                const arrayBuffer = await response.arrayBuffer();
                const file = { data: arrayBuffer, name: videoUrl.split('/').pop() };

                // 销毁之前的worker
                if (worker) {
                    worker.postMessage({ type: 'abort' });
                    worker.terminate();
                    worker = null;
                }

                // 创建新的Worker
                const workerCode = `
importScripts('https://media.youyan.xyz/youling-lite-sdk/mp4box.all.min.js');

let abortFlag = false;
let mp4boxfile = null;
let videoDecoder = null;
let videoTrack = null;
let arrayBuffer = null;

// DataStream构造函数
function DataStream(buffer, byteOffset, littleEndian) {
    this.buffer = buffer || new ArrayBuffer(0);
    this.byteOffset = byteOffset || 0;
    this.littleEndian = littleEndian || false;
    this.position = 0;
    this.view = new DataView(this.buffer, this.byteOffset);
}
DataStream.BIG_ENDIAN = false;
DataStream.LITTLE_ENDIAN = true;
DataStream.prototype.write = function(value, type) {
    switch(type) {
        case 'Uint8':
            this.ensureCapacity(1);
            this.view.setUint8(this.position, value);
            this.position += 1;
            break;
        case 'Uint32':
            this.ensureCapacity(4);
            this.view.setUint32(this.position, value, this.littleEndian);
            this.position += 4;
            break;
        default:
            throw new Error('Unsupported type: ' + type);
    }
};
DataStream.prototype.ensureCapacity = function(additionalBytes) {
    if (this.position + additionalBytes > this.buffer.byteLength) {
        const newBuffer = new ArrayBuffer(this.position + additionalBytes);
        new Uint8Array(newBuffer).set(new Uint8Array(this.buffer));
        this.buffer = newBuffer;
        this.view = new DataView(this.buffer);
    }
};

onmessage = function(e) {
    if (e.data.type === 'decode') {
        abortFlag = false;
        decodeFile(e.data.file);
    } else if (e.data.type === 'abort') {
        abortFlag = true;
        if (videoDecoder) {
            try { videoDecoder.close(); } catch (err) {}
            videoDecoder = null;
        }
        if (mp4boxfile) {
            try { mp4boxfile.flush(); } catch (err) {}
            mp4boxfile = null;
        }
        videoTrack = null;
        arrayBuffer = null;
        self.close();
    }
};

function decodeFile(file) {
    arrayBuffer = file.data;
    mp4boxfile = MP4Box.createFile();
    videoTrack = null;
    let frameIndex = 0;
    let totalFrames = 0;
    
    mp4boxfile.onReady = function(info) {
        if (abortFlag) return;
        videoTrack = info.videoTracks[0];
        if (!videoTrack) {
            postMessage({ type: 'error', error: 'No video track found' });
            return;
        }
        totalFrames = videoTrack.nb_samples - 2; // 保持原逻辑
        console.log('totalFrames', totalFrames);
        postMessage({ 
            type: 'videoInfo', 
            width: videoTrack.track_width, 
            height: videoTrack.track_height,
            totalFrames: totalFrames
        });
        mp4boxfile.setExtractionOptions(videoTrack.id, null, {
            nbSamples: totalFrames,
            rapAlignement: true
        });
        mp4boxfile.start();
    };
    
    mp4boxfile.onSamples = function(trackId, ref, samples) {
        if (abortFlag || !videoTrack || trackId !== videoTrack.id) return;
        
        if (!videoDecoder) {
            try {
                videoDecoder = new VideoDecoder({
                    output: handleFrame,
                    error: err => postMessage({ type: 'error', error: err.message })
                });
                const entry = mp4boxfile.moov.traks[0].mdia.minf.stbl.stsd.entries[0];
                const box = entry.avcC ?? entry.hvcC ?? entry.vpcC;
                let description;
                if (box) {
                    const stream = new DataStream(undefined, 0, DataStream.BIG_ENDIAN);
                    box.write(stream);
                    description = new Uint8Array(stream.buffer.slice(8));
                }
                videoDecoder.configure({
                    codec: videoTrack.codec,
                    codedWidth: videoTrack.track_width,
                    codedHeight: videoTrack.track_height,
                    description,
                    optimizeForLatency: true,
                    hardwareAcceleration: "prefer-software"
                });
            } catch (err) {
                postMessage({ type: 'error', error: 'Decoder config failed: ' + err.message });
                return;
            }
        }
        
        // 解码样本
        for (let i = 0; i < samples.length; i++) {
            if (abortFlag) break;
            const sample = samples[i];
            try {
                videoDecoder.decode(new EncodedVideoChunk({
                    type: sample.is_sync ? 'key' : 'delta',
                    timestamp: sample.cts,
                    duration: sample.duration || 0,
                    data: sample.data
                }));
            } catch (err) {
                postMessage({ type: 'error', error: 'Decode error: ' + err.message });
            }
        }
    };
    
    mp4boxfile.onEnded = function() {
        if (abortFlag) return;
        if (videoDecoder) {
            videoDecoder.flush().then(() => postMessage({ type: 'done' }))
                .catch(err => postMessage({ type: 'error', error: 'Flush error: ' + err.message }));
        } else {
            postMessage({ type: 'done' });
        }
    };
    
    function handleFrame(videoFrame) {
        if (abortFlag) {
            videoFrame.close();
            return;
        }
        postMessage({ 
            type: 'frame', 
            frame: videoFrame, 
            index: frameIndex++, 
            totalFrames: totalFrames 
        }, [videoFrame]);
    }
    
    arrayBuffer.fileStart = 0;
    mp4boxfile.appendBuffer(arrayBuffer);
    mp4boxfile.flush();
}
                `;

                const blob = new Blob([workerCode], { type: "application/javascript" });
                const workerURL = URL.createObjectURL(blob);
                worker = new Worker(workerURL);

                // 监听worker消息
                worker.onmessage = function(e) {
                    switch(e.data.type) {
                        case 'videoInfo':
                            canvas.width = e.data.width;
                            canvas.height = e.data.height;
                            currentVideoTotalFrames = e.data.totalFrames;
                            break;
                            
                        case 'frame':
                            frames.push(e.data.frame);
                            totalDecodedFrames++;
                            const progress = currentVideoTotalFrames > 0 
                                ? Math.floor((e.data.index / currentVideoTotalFrames) * 100) 
                                : 0;
                            updateProgress(progress);
                            updateStatus(`Decoding frame ${e.data.index + 1}/${currentVideoTotalFrames}`);
                            updateStats();
                            
                            // 缓冲足够帧后再开始渲染（核心优化：避免边解边渲染的闪烁）
                            if (!isRendering && frames.length >= MIN_BUFFER_FRAMES) {
                                startRendering();
                            }
                            break;
                            
                        case 'done':
                            updateStatus(`Decoding complete (${currentVideoTotalFrames} frames)`);
                            updateProgress(100);
                            updateStats();
                            // 如果还没开始渲染（如视频太短），强制启动
                            if (!isRendering) startRendering();
                            break;
                            
                        case 'error':
                            updateStatus(`Error: ${e.data.error}`);
                            currentVideoIndex++;
                            setTimeout(processVideoList, 1000);
                            break;
                    }
                };

                // 发送解码请求
                worker.postMessage({ type: 'decode', file: file });

            } catch (err) {
                updateStatus(`Load error: ${err.message}`);
                currentVideoIndex++;
                setTimeout(processVideoList, 1000);
            }
        }

        // 启动渲染循环
        function startRendering() {
            if (isRendering) return;
            isRendering = true;
            lastRenderTime = performance.now();
            renderFrames();
        }

        // 渲染帧循环
        function renderFrames(timestamp) {
            if (!timestamp) timestamp = performance.now();
            const elapsed = timestamp - lastRenderTime;

            // 按24fps间隔渲染
            if (elapsed >= FRAME_INTERVAL) {
                lastRenderTime = timestamp - (elapsed % FRAME_INTERVAL);

                if (frames.length > 0) {
                    // 1. 先清空画布（关键：避免上一帧残留导致闪烁）
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    // 2. 渲染当前帧
                    const frame = frames.shift();
                    ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
                    frame.close(); // 及时释放资源
                    
                    // 3. 更新状态
                    totalRenderedFrames++;
                    updateStats();
                    
                    // 4. 计算当前视频渲染进度
                    const renderedInVideo = totalRenderedFrames % currentVideoTotalFrames;
                    const progress = currentVideoTotalFrames > 0 
                        ? Math.floor((renderedInVideo / currentVideoTotalFrames) * 100) 
                        : 0;
                    updateStatus(`Rendering video ${currentVideoIndex + 1}/${videoList.length} (${progress}%)`);
                    
                    // 5. 判断当前视频是否渲染完毕
                    if (renderedInVideo === currentVideoTotalFrames - 1) {
                        isVideoComplete = true;
                    }
                }

                // 6. 若当前视频渲染完毕且帧队列为空，切换到下一视频
                if (isVideoComplete && frames.length === 0) {
                    isRendering = false; // 暂停渲染
                    currentVideoIndex++;
                    setTimeout(processVideoList, 100); // 延迟切换，避免卡顿
                    return;
                }
            }

            // 继续渲染循环
            animationFrameId = requestAnimationFrame(renderFrames);
        }

        // 更新统计信息
        function updateStats() {
            document.getElementById('decodedFrames').textContent = totalDecodedFrames;
            document.getElementById('renderedFrames').textContent = totalRenderedFrames;
            document.getElementById('queueSize').textContent = frames.length;
        }

        // 工具函数
        function updateStatus(text) { document.getElementById('status').textContent = text; }
        function updateProgress(percent) { document.getElementById('progressBar').style.width = `${percent}%`; }

        // 页面生命周期管理
        window.addEventListener('load', init);
        window.addEventListener('beforeunload', () => {
            if (worker) {
                worker.postMessage({ type: 'abort' });
                worker.terminate();
            }
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            frames.forEach(frame => frame.close());
        });
    </script>
</body>
</html>
