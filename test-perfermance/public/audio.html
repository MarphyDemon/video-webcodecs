<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单音频播放器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        .container {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .controls {
            margin: 20px 0;
        }
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
            padding: 10px;
            font-family: monospace;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        button.stop {
            background-color: #f44336;
        }
        button.stop:hover {
            background-color: #d32f2f;
        }
        .status {
            margin: 15px 0;
            padding: 10px;
            border-radius: 4px;
            background-color: #f5f5f5;
        }
        .volume-control {
            margin: 15px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
        }
        .instructions {
            margin-top: 20px;
            padding: 10px;
            background-color: #e3f2fd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>音频播放器</h1>
        
        <div class="controls">
            <label for="audioData">音频数据 (Uint8Array):</label>
            <textarea id="audioData" placeholder="输入音频数据，例如：new Uint8Array([...])"></textarea>
            
            <div class="volume-control">
                <label for="volume">音量:</label>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
            </div>
            
            <button id="playBtn">播放</button>
            <button id="stopBtn" class="stop">停止</button>
        </div>
        
        <div class="status" id="status">
            状态：就绪
        </div>
        
        <div class="instructions">
            <h3>使用说明：</h3>
            <p>1. 在文本框中输入音频数据（Uint8Array格式）</p>
            <p>2. 点击"播放"按钮播放音频</p>
            <p>3. 可通过音量滑块调节音量</p>
            <p>4. 点击"停止"按钮停止播放</p>
        </div>
    </div>

        // 模拟DataCacheQueue类，用于存储和获取音频数据
        class DataCacheQueue {
             audioDataMap = new Map();
            
            // 存储音频数据
            setAudio(frameIndex, audioData) {
                this.audioDataMap.set(frameIndex, { ad: audioData });
            }
            
            // 获取指定帧的音频数据
            _getAudio(frameIndex) {
                return this.audioDataMap.get(frameIndex);
            }
            
            // 获取区间内的音频数据
            _getAudioInterval(startIndex, endIndex) {
                // 实际应用中应该返回区间内的合并数据
                // 这里简化处理，返回结束帧的数据
                return this.audioDataMap.get(endIndex);
            }
        }

        // 音频渲染类（基于提供的代码）
        class AudioRender {
             TAG;
             options;
            audioCtx;
            source = null;
            isPlaying = false;
            gainNode = null;
            lastFrameIndex = -1;

            constructor(options) {
                this.options = options;
            }

            async render(frameIndex) {
                    this.audioCtx = new AudioContext();
                // 检查AudioContext状态，如果被暂停则尝试恢复
                if (this.audioCtx.state === "suspended") {
                    updateStatus('AudioContext被暂停，尝试恢复...');
                    try {
                        await this.audioCtx.resume();
                        updateStatus('AudioContext恢复成功');
                    } catch (error) {
                        updateStatus(`AudioContext恢复失败: ${error}`);
                        return;
                    }
                }
                
                if (this.lastFrameIndex === -1) {
                    this.lastFrameIndex = frameIndex;
                }
                let audioFrame = null;
                
                if (frameIndex - this.lastFrameIndex > 1) {
                    audioFrame = this.options.dataCacheQueue._getAudioInterval(
                        this.lastFrameIndex,
                        frameIndex
                    );
                } else {
                    audioFrame = this.options.dataCacheQueue._getAudio(frameIndex);
                }
                this.lastFrameIndex = frameIndex;

                // 获取音频帧数据
                if (!audioFrame?.ad) {
                    updateStatus('没有可用的音频数据');
                    return;
                }

                updateStatus(`准备播放音频: 帧索引 ${frameIndex}`);

                try {
                    console.log(1111)
                    const audioBuffer = await this.audioCtx.decodeAudioData(audioFrame.ad);
                    updateStatus(`音频解码成功: 时长 ${audioBuffer.duration.toFixed(2)}s, 采样率 ${audioBuffer.sampleRate}`);
                    console.log(22222)
                    // 停止当前正在播放的音频
                    if (this.source) {
                        this.source.stop();
                        this.source.disconnect();
                    }
                    
                    // 创建音频源并播放
                    this.source = this.audioCtx.createBufferSource();
                    this.source.buffer = audioBuffer;
                    
                    // 创建增益节点（控制音量）
                    this.gainNode = this.audioCtx.createGain();
                    this.gainNode.gain.value = parseFloat((document.getElementById('volume')).value);
                    
                    // 连接并播放
                    this.source.connect(this.gainNode);
                    this.gainNode.connect(this.audioCtx.destination);
                    
                    this.source.start();
                    this.isPlaying = true;
                    updateStatus('开始播放音频');

                    // 监听播放结束
                    this.source.onended = () => {
                        updateStatus('音频播放结束');
                        this.isPlaying = false;
                        this.source = null;
                    };
                } catch (error) {
                    console.log(error, "错误名称", error?.name, "错误信息", error?.message)
                    updateStatus(`音频解码失败: ${error}`);
                    this.isPlaying = false;
                    this.source = null;
                }
            }

            stop() {
                this.setVolume(0);
                if (this.source) {
                    this.source.stop();
                    this.source.disconnect();
                }
                this.source = null;
                if (this.gainNode) {
                    this.gainNode.disconnect();
                }
                this.gainNode = null;
                this.isPlaying = false;
                updateStatus('音频已停止');
            }

            setVolume(volume) {
                if (this.gainNode) {
                    this.gainNode.gain.value = volume;
                }
            }

            destroy() {
                this.setVolume(0);
                if (this.source) {
                    this.source.stop();
                    this.source.disconnect();
                }
                this.source = null;
                if (this.gainNode) {
                    this.gainNode.disconnect();
                }
                this.gainNode = null;
                this.isPlaying = false;
                if (this.audioCtx.state !== "closed") {
                    this.audioCtx.close();
                }
                updateStatus('音频播放器已销毁');
            }
        }

        // 页面辅助函数
        function updateStatus(text) {
            const statusElement = document.getElementById('status');
            if (statusElement) {
                statusElement.textContent = `状态：${text}`;
                console.log(`[Status] ${text}`);
            }
        }
