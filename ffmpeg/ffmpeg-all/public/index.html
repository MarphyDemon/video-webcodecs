<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频处理工具集</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* 头部 */
    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 40px 20px;
    }

    header h1 {
      font-size: 2rem;
      color: white;
      margin-bottom: 12px;
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    header p {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.9);
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* 卡片网格 */
    .card-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 768px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      header h1 {
        font-size: 2.5rem;
      }
    }

    /* 卡片样式 */
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .card-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 2rem;
    }

    .card-icon.primary {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    }

    .card-icon.secondary {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    .card h2 {
      font-size: 1.375rem;
      color: #1e293b;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .card p {
      font-size: 0.9375rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .card-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9375rem;
      transition: opacity 0.2s ease;
    }

    .card-btn:hover {
      opacity: 0.9;
    }

    .card-btn svg {
      width: 18px;
      height: 18px;
    }

    /* 功能特性列表 */
    .features {
      margin-top: 48px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
    }

    .features h3 {
      text-align: center;
      color: white;
      font-size: 1.25rem;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .features-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: white;
      font-size: 0.875rem;
    }

    .feature-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* 页脚 */
    footer {
      text-align: center;
      margin-top: 48px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.875rem;
      padding: 20px;
    }

    /* 响应式调整 */
    @media (max-width: 480px) {
      body {
        padding: 12px;
      }

      header {
        padding: 24px 12px;
        margin-bottom: 24px;
      }

      header h1 {
        font-size: 1.5rem;
      }

      .card {
        padding: 20px;
      }

      .card-icon {
        width: 48px;
        height: 48px;
        font-size: 1.5rem;
        margin-bottom: 16px;
      }

      .card h2 {
        font-size: 1.125rem;
      }

      .features {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <header>
      <h1>🎬 视频处理工具集</h1>
      <p>基于 FFmpeg 的在线视频处理工具，无需安装任何软件，直接在浏览器中处理视频</p>
    </header>

    <!-- 功能卡片 -->
    <div class="card-grid">
      <div class="card" onclick="location.href='ffmpeg.html'">
        <div class="card-icon primary">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </div>
        <h2>视频帧解码器</h2>
        <p>将视频文件解码为独立的帧图像，支持自定义帧率和输出格式，针对无音频视频进行了特别优化</p>
        <a href="ffmpeg.html" class="card-btn">
          <span>开始使用</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>
      </div>

      <div class="card" onclick="location.href='ffprobe-analyzer.html'">
        <div class="card-icon secondary">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="16"></line>
          </svg>
        </div>
        <h2>视频信息分析器</h2>
        <p>解析视频文件的详细信息，包括编码格式、分辨率、时长、帧率等元数据</p>
        <a href="ffprobe-analyzer.html" class="card-btn">
          <span>开始使用</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </a>
      </div>
    </div>

    <!-- 功能特性 -->
    <div class="features">
      <h3>主要特性</h3>
      <div class="features-list">
        <div class="feature-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>完全在线</span>
        </div>
        <div class="feature-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>本地处理</span>
        </div>
        <div class="feature-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>隐私安全</span>
        </div>
        <div class="feature-item">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>支持多种格式</span>
        </div>
      </div>
    </div>

    <!-- 页脚 -->
    <footer>
      <p>基于 FFmpeg.js 构建 | 所有处理均在浏览器中完成，数据不会上传到服务器</p>
    </footer>
  </div>
</body>
</html>
